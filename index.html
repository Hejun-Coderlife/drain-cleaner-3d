<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYPER CLEAN 管道疏通泡沫 · 3D 原理演示</title>
<style>
  :root { --pink:#f48cbf; --panel:rgba(16,16,19,.80); --line:rgba(255,255,255,.13); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#141416; overflow:hidden;
    font:14px/1.5 "PingFang SC","Helvetica Neue",system-ui,sans-serif; color:#eee; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* 顶部细工具栏：闲置自动淡化（同门店版） */
  #hud { position:fixed; left:8px; top:8px; right:8px; z-index:5;
    display:flex; align-items:center; flex-wrap:wrap; gap:5px;
    padding:5px 8px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 6px 22px rgba(0,0,0,.25);
    opacity:1; transition:opacity .45s ease; }
  #hud.idle { opacity:.22; }
  #hud:hover { opacity:1 !important; }
  body.uihide #hud, body.uihide #tip, body.uihide #dock { display:none; }

  .brand { font-size:12.5px; font-weight:600; letter-spacing:.4px; padding:0 6px 0 2px; white-space:nowrap; }
  .brand b { color:var(--pink); font-weight:700; }
  .sep { width:1px; height:18px; background:rgba(255,255,255,.16); margin:0 3px; flex:none; }
  .row { display:flex; gap:5px; flex-wrap:wrap; }

  button { background:rgba(255,255,255,.10); color:#f0f0f4; border:1px solid rgba(255,255,255,.18);
    padding:4px 9px; border-radius:6px; cursor:pointer; font:inherit; font-size:12px; line-height:1.35;
    white-space:nowrap; transition:background .15s,border-color .15s; }
  button:hover { background:rgba(244,140,191,.28); border-color:var(--pink); }
  button.tg { background:rgba(244,140,191,.24); border-color:rgba(244,140,191,.65); }
  button.tg.off { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.14); color:#9a9aa2; }

  /* 底部：步骤说明 + 播放条 */
  #dock { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:5;
    width:min(860px, calc(100vw - 24px)); display:flex; flex-direction:column; gap:7px; align-items:center; }
  #cap { padding:7px 18px; border-radius:22px; font-size:17px; font-weight:600; letter-spacing:.5px;
    background:var(--panel); border:1px solid var(--line); color:#fff;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 6px 22px rgba(0,0,0,.25);
    transition:opacity .3s; }
  #cap.hint { color:#ffd0e6; font-weight:500; font-size:15px; }
  #bar3 { width:100%; display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:12px;
    background:var(--panel); border:1px solid var(--line);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 6px 22px rgba(0,0,0,.25); }
  #playBtn { width:38px; height:30px; padding:0; font-size:14px; background:var(--pink); border-color:var(--pink); color:#fff; }
  #playBtn:hover { filter:brightness(1.08); }
  #track { position:relative; flex:1; height:30px; }
  #range { position:absolute; inset:0; width:100%; margin:0; opacity:0; cursor:pointer; z-index:2; }
  #rail { position:absolute; left:0; right:0; top:13px; height:4px; border-radius:2px; background:rgba(255,255,255,.18); }
  #fillBar { position:absolute; left:0; top:13px; height:4px; border-radius:2px; background:var(--pink); width:0; }
  #knob { position:absolute; top:8px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:#fff;
    box-shadow:0 0 0 3px rgba(244,140,191,.55); left:0; }
  .dot { position:absolute; top:10px; width:10px; height:10px; margin-left:-5px; border-radius:50%;
    background:#5a5a62; border:2px solid #1b1b1f; z-index:3; cursor:pointer; }
  .dot.done { background:var(--pink); }
  .dot:hover::after { content:attr(data-label); position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    white-space:nowrap; font-size:11.5px; padding:3px 8px; border-radius:6px; background:#000c; color:#fff; }
  #time { font:12px/1 ui-monospace,Menlo,monospace; color:#b8b8c0; width:74px; text-align:right; }

  #tip { position:fixed; right:10px; bottom:9px; z-index:4; font-size:11px; color:#b4b4bb; text-align:right;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 10px;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    opacity:1; transition:opacity .45s ease; }
  #tip.idle { opacity:.18; }
  #tip:hover { opacity:1 !important; }
  @media (max-width:1300px) { #tip { display:none; } }

  #load { position:fixed; inset:0; display:grid; place-content:center; background:#141416; z-index:9;
    color:#8a8a90; font-size:13px; letter-spacing:2px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="load">HYPER CLEAN · 建模中…</div>

<div id="hud">
  <span class="brand"><b>HYPER CLEAN</b> 管道疏通泡沫</span>
  <span class="sep"></span>
  <div class="row" id="views"></div>
  <span class="sep"></span>
  <button id="autoCam" class="tg">自动运镜</button>
  <button id="bg" class="tg off">深色背景</button>
  <span class="sep"></span>
  <button id="replay">从头播放</button>
  <button id="reset">复位</button>
  <button id="exp">导出罐子 GLB</button>
  <button id="fs">全屏</button>
</div>

<div id="dock">
  <div id="cap" class="hint">👆 点击罐子或 ▶ 开始演示</div>
  <div id="bar3">
    <button id="playBtn">▶</button>
    <div id="track">
      <div id="rail"></div><div id="fillBar"></div><div id="knob"></div>
      <input id="range" type="range" min="0" step="0.01" value="0">
    </div>
    <span id="time">0.0 / 18s</span>
  </div>
</div>

<div id="tip">左键旋转 · 右键平移 · 滚轮缩放 · 空格 播放/暂停<br>点圆点跳到对应步骤 ·「H」收起界面 ·「F」全屏</div>

<script>
  /* 界面层：app.js 通过 window.__DRAIN_UI 调用 */
  (() => {
    const $ = id => document.getElementById(id);
    let END = 18, steps = [], cb = {}, lastStep = -1, started = false;
    const fmt = t => t.toFixed(1) + ' / ' + END.toFixed(0) + 's';
    window.__DRAIN_UI = {
      init(o) {
        END = o.end; steps = o.steps; cb = o;
        $('range').max = END;
        for (const [k, v] of Object.entries(o.views)) {
          const b = document.createElement('button'); b.textContent = v.name; b.onclick = () => cb.onView(k);
          $('views').appendChild(b);
        }
        steps.forEach(([t, label], i) => {
          const d = document.createElement('div'); d.className = 'dot'; d.style.left = (t / END * 100) + '%';
          d.dataset.label = label; d.onclick = () => { started = true; cb.onStep(t + 0.001); };
          $('track').appendChild(d);
        });
        $('playBtn').onclick = () => { started = true; cb.onPlay(); };
        $('replay').onclick = () => { started = true; cb.onReplay(); };
        $('reset').onclick = () => { started = false; lastStep = -1; cb.onReset(); };
        $('range').oninput = e => { started = true; cb.onScrub(parseFloat(e.target.value)); };
        $('autoCam').onclick = e => cb.onAutoCam(e.currentTarget.classList.contains('off'));
        $('bg').onclick = e => { const b = e.currentTarget; b.classList.toggle('off'); cb.onBg(!b.classList.contains('off')); };
        $('exp').onclick = () => { $('exp').textContent = '导出中…'; cb.onExport(); };
        $('fs').onclick = toggleFS;
      },
      setStep(i, text, T) {
        const p = T / END * 100;
        $('fillBar').style.width = p + '%'; $('knob').style.left = p + '%';
        if (document.activeElement !== $('range')) $('range').value = T;
        $('time').textContent = fmt(T);
        if (T > 0.001) started = true;
        const cap = $('cap');
        if (!started) { cap.className = 'hint'; cap.textContent = '👆 点击罐子或 ▶ 开始演示'; return; }
        cap.className = ''; cap.textContent = text;
        if (i !== lastStep) {
          lastStep = i;
          document.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('done', k <= i));
        }
      },
      setPlaying(v) { $('playBtn').textContent = v ? '❚❚' : '▶'; if (v) started = true; },
      setAutoCam(v) { $('autoCam').classList.toggle('off', !v); },
      exportDone(ok) { $('exp').textContent = ok ? '导出罐子 GLB' : '导出失败'; },
    };
    function toggleFS() {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    }
    const hud = $('hud'), tip = $('tip');
    let idleTimer;
    const wake = () => {
      hud.classList.remove('idle'); tip.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { hud.classList.add('idle'); tip.classList.add('idle'); }, 2200);
    };
    addEventListener('pointermove', wake, { passive: true });
    addEventListener('pointerdown', wake, { passive: true });
    wake();
    addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.target.tagName === 'INPUT') return;
      if (e.code === 'KeyH') document.body.classList.toggle('uihide');
      if (e.code === 'KeyF') toggleFS();
    });
    addEventListener('error', e => {
      const l = $('load');
      if (l) l.textContent = '加载失败：' + (e.message || e);
    });
  })();
</script>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module">
  import './app.js';
  document.getElementById('load').remove();
</script>
</body>
</html>
